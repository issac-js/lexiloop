name: Clean obsolete LexiLoop test artifacts

on:
  push:
    branches: [main]
    paths: ['.github/workflows/artifact-cleanup.yml']
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only list eligible artifacts (no deletion)'
        type: boolean
        default: true

permissions:
  actions: write
  contents: read

concurrency:
  group: lexiloop-artifact-cleanup
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      - name: Delete old browser and iOS test artifacts, never release ZIPs
        run: |
          node --input-type=module <<'JS'
          const repo = process.env.GITHUB_REPOSITORY;
          const apiBase = process.env.GITHUB_API_URL || 'https://api.github.com';
          const token = process.env.GH_TOKEN;
          const bootstrap = process.env.GITHUB_EVENT_NAME === 'push';
          const dryRun = process.env.GITHUB_EVENT_NAME === 'workflow_dispatch' && process.env.DRY_RUN === 'true';
          const prefixAllowlist = ['browser-results-', 'ios-safari-results-'];
          async function request(method, path) {
            const r = await fetch(apiBase + path, {method, headers:{
              Authorization: 'Bearer ' + token, Accept:'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28'
            }});
            if (!r.ok) throw new Error(method + ' ' + path + ': HTTP '+r.status+' '+(await r.text()).slice(0,300));
            return method === 'GET' ? r.json() : null;
          }
          const artifacts = [];
          for (let page=1; page<=20; page++) {
            const resp = await request('GET', '/repos/'+repo+'/actions/artifacts?per_page=100&page='+page);
            artifacts.push(...resp.artifacts);
            if (resp.artifacts.length < 100) break;
            if (page === 20) throw new Error('Pagination limit reached; refuse incomplete cleanup');
          }
          let eligible=0, removed=0, bytes=0;
          const cutoff = Date.now() - 3 * 86400000;
          for (const a of artifacts) {
            if (!prefixAllowlist.some(prefix => a.name.startsWith(prefix))) continue;
            // No lexiloop-FULL_SHA release bundles, manual release snapshots, or source assets.
            if (!bootstrap && Date.parse(a.created_at) >= cutoff) continue;
            eligible++;
            if (dryRun) { console.log('DRY RUN: '+a.name+' ('+a.id+')'); continue; }
            await request('DELETE','/repos/'+repo+'/actions/artifacts/'+a.id);
            removed++; bytes += a.size_in_bytes || 0;
            console.log('Deleted '+a.id+' '+a.name);
          }
          const report = [
            '# LexiLoop test artifact cleanup',
            'Repository: '+repo,
            'Mode: '+(bootstrap ? 'one-time bootstrap' : 'weekly, older than three days'),
            'Eligible: '+eligible,
            'Deleted: '+removed,
            'Recovered nominal bytes: '+(bytes/1048576).toFixed(1)+' MiB',
            'Dry run: '+dryRun,
            'Only browser-results-* and ios-safari-results-*. All lexiloop-FULL_SHA releases retained.'
          ].join('\n\n');
          console.log(report);
          if (process.env.GITHUB_STEP_SUMMARY) {
            const fs = await import('node:fs/promises');
            await fs.appendFile(process.env.GITHUB_STEP_SUMMARY, report + '\n');
          }
          JS
