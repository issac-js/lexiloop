name: LexiLoop checks and release bundle

on:
  pull_request:
  push:
    branches: [main, 'sync/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lexiloop-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: LF source and checkout check
        run: python -B tools/check_line_endings.py
      - name: Offline checks
        run: python -B tools/ci_check.py
      - name: Package exact source revision
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -B tools/release_bundle.py --sha "$SOURCE_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lexiloop-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install isolated browser test dependency
        run: npm install --prefix "$RUNNER_TEMP/browser-deps" --no-audit --no-fund --ignore-scripts playwright@1.62.1
      - name: Install browser engines
        run: node "$RUNNER_TEMP/browser-deps/node_modules/playwright/cli.js" install --with-deps chromium webkit
      - name: Real Chromium and WebKit checks with synthetic SDK
        env:
          NODE_PATH: ${{ runner.temp }}/browser-deps/node_modules
          LEXILOOP_BROWSER_OUT_DIR: ${{ runner.temp }}/browser-results
        run: node tools/browser-check.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-results-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/browser-results/
          if-no-files-found: error
          retention-days: 14

  ios-safari:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare iOS Simulator and XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          sdk = tuple(map(int, subprocess.check_output(['xcrun', '--sdk', 'iphonesimulator', '--show-sdk-version'], text=True).strip().split('.')))
          runtimes = [r for r in devices if '.iOS-' in r and tuple(map(int, r.split('.iOS-')[-1].split('-'))) <= sdk]
          candidates = [d for runtime in sorted(runtimes, reverse=True) for d in devices[runtime] if d['name'].startswith('iPhone')]
          if not candidates: raise SystemExit('No available iOS Simulator; not a passing or skipped test')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('LEXILOOP_SIMULATOR_ID=' + candidates[0]['udid'] + '\n')
              f.write('LEXILOOP_BROWSER_OUT_DIR=' + os.path.join(os.environ['RUNNER_TEMP'], 'ios-safari-results') + '\n')
          print(json.dumps(candidates[0]))
          PY
      - name: Boot Simulator and isolated fixture server
        run: |
          mkdir -p "$LEXILOOP_BROWSER_OUT_DIR"
          node tools/lib/browser-fixture-server.js > "$LEXILOOP_BROWSER_OUT_DIR/server.log" 2>&1 &
          xcrun simctl boot "$LEXILOOP_SIMULATOR_ID" || true
          xcrun simctl bootstatus "$LEXILOOP_SIMULATOR_ID" -b
          xcrun simctl status_bar "$LEXILOOP_SIMULATOR_ID" override --time '9:41' --batteryState charged --batteryLevel 100
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool NO
          open -a Simulator
      - name: Native Safari taps, input, keyboard and learning checks
        run: |
          cd tools/ios
          xcodegen generate
          if ! xcodebuild test -project LexiLoopSafariQA.xcodeproj -scheme SafariQA -destination "platform=iOS Simulator,id=$LEXILOOP_SIMULATOR_ID" -parallel-testing-enabled NO -resultBundlePath "$LEXILOOP_BROWSER_OUT_DIR/SafariQA.xcresult" CODE_SIGNING_ALLOWED=NO > "$LEXILOOP_BROWSER_OUT_DIR/xcodebuild.log" 2>&1; then
            tail -100 "$LEXILOOP_BROWSER_OUT_DIR/xcodebuild.log"
            exit 1
          fi
      - name: Check Simulator Safari report
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads((Path(os.environ['LEXILOOP_BROWSER_OUT_DIR'])/'ios-safari-results.json').read_text())
          print(json.dumps(report, ensure_ascii=False))
          assert report['pass'] >= 5 and report['fail'] == 0
          PY
      - name: Capture final Simulator screen
        if: always()
        run: xcrun simctl io "$LEXILOOP_SIMULATOR_ID" screenshot "$LEXILOOP_BROWSER_OUT_DIR/ios-safari-final.png"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ios-safari-results-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/ios-safari-results/
          if-no-files-found: error
          retention-days: 14
